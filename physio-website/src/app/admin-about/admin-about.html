<div class="admin-about-page">

  <header class="page-header">

    <div>
      <p class="small-title">ADMIN PANEL</p>
      <h1>Manage About</h1>
      <p class="subtitle">
        Update the doctor's professional information.
      </p>
    </div>

    <a routerLink="/admin" class="back-btn">
      Back to Dashboard
    </a>

  </header>


  <section class="editor-card">

    <div class="card-heading">

      <div>
        <p class="label">DOCTOR INFORMATION</p>
        <h2>About the Doctor</h2>
      </div>

    </div>


    <form>

      <div class="form-group">

        <label>Doctor's Photo</label>

        <div style="border: 2px dashed #c9ddda; border-radius: 12px; padding: 25px; text-align: center; background: #fbfdfd;">

          <div *ngIf="!previewUrl && about.photoUrl" style="margin-bottom: 15px;">
            <img
              [src]="aboutService.getFullImageUrl(about.photoUrl)"
              style="max-width: 180px; max-height: 220px; border-radius: 10px; object-fit: cover;"
            >
          </div>

          <div *ngIf="previewUrl" style="margin-bottom: 15px;">
            <img
              [src]="previewUrl"
              style="max-width: 180px; max-height: 220px; border-radius: 10px; object-fit: cover;"
            >
          </div>

          <p style="color: #666; margin: 0 0 12px; font-size: 14px;">
            {{ about.photoUrl ? 'Choose a new photo to replace the current one' : 'Choose a photo to upload' }}
          </p>

          <input
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
          >

        </div>

      </div>


      <div class="form-row">

        <div class="form-group">

          <label>Experience</label>

          <input
            type="text"
            placeholder="Example: 4+ Years"
            [(ngModel)]="about.experience"
            name="experience"
          >

        </div>


        <div class="form-group">

          <label>Patients Treated</label>

          <input
            type="text"
            placeholder="Example: 100+"
            [(ngModel)]="about.patientsTreated"
            name="patientsTreated"
          >

        </div>

      </div>


      <div class="form-actions">

        <a routerLink="/admin" class="cancel-btn">
          Cancel
        </a>

        <button
          type="button"
          class="save-btn"
          (click)="saveChanges()">
          Save Changes
        </button>

      </div>

    </form>

  </section>

</div>
